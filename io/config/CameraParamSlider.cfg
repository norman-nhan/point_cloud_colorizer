#!/usr/bin/env python3

PACKAGE = "point_cloud_colorizer"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

""" gen.add(name, type, level, description, default, min, max)
name: param name, this name will be shown in rqt reconfigure
type: data type,
level: priority level,
description: description,
default, min, max: value of param
"""

gen.add("offset_x", double_t, 0, "LiDAR-Camera offset-x", -0.09, -1.0, 1.0) # prev 0.01
gen.add("offset_y", double_t, 0, "LiDAR-Camera offset-y", -0.03, -1.0, 1.0) # prev 0.01
gen.add("offset_z", double_t, 0, "LiDAR-Camera offset-z", 0.02, -1.0, 1.0)  # prev 0.01
gen.add("vFOV", double_t, 0, "Camera vertical FOV", 0.516, 0.0, 3.14*2)     # prev 0.6666
gen.add("hFOV", double_t, 0, "Camera horizontal FOV", 0.734, 0.0, 3.14*2)   # prev 0.8642

# exit(gen.generate(PACKAGE, namespace, auto-generated-class-name))
exit(gen.generate(PACKAGE, "point_cloud_colorizer", "CameraParamSlider"))