start_service_name: "start_capture" # Defines name suffix for std_srvs::Empty service which restarts suspended streaming
stop_service_name: "stop_capture"   # Defines name suffix for std_srvs::Empty service which suspends camera polling timer

video_device: /dev/video0           # Device driver's entrypoint
io_method: mmap                   
pixel_format: yuyv                  
color_format: yuv422p
create_suspended: false             # Instructs the node whether to start streaming immediately after launch or to wait until the start service will be triggered
full_ffmpeg_log: false              # Allows to suppress warning messages generated by libavcodec, cleans log
camera_name: webcam            # ROS internal name for the camera, used to generate camera_info message
camera_frame_id: webcam        # Frame ID used to generate coordinate transformations
camera_transport_suffix: image_raw  # Suffix used by image_transport to generate topic names
camera_info_url: "package://point_cloud_colorizer/io/config/webcam_calibration.yml"                 # URI for camera calibration data (likely a YML file obtained from camera_calibration)
# image_width: 640                    # Frame dimensions, should be supported by camera hardware
# image_height: 480
framerate: 30                       # Camera polling frequency, Hz (integer)

intrinsic_controls:  # it always put warning if your camera does not support focus auto and white_balance_temperature_auto. Ignore it! It works fine.
    focus_auto: true 
    exposure_auto_priority: true
    exposure_auto: 3
    white_balance_temperature_auto: true
    power_line_frequency: 1
    ignore: [
        brightness,
        contrast,
        saturation,
        gain,
        sharpness,
        backlight_compensation,
        white_balance_temperature,
        exposure_absolute,
        pan_absolute,
        tilt_absolute,
        focus_absolute,
        zoom_absolute
    ]